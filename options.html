<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>PGCR Stats Settings</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                padding: 16px 20px;
                width: 240px;
                font:
                    14px/1.4 Roboto,
                    system-ui,
                    sans-serif;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 1rem;
                font-weight: 500;
            }
            p {
                margin: 0 0 14px;
                font-size: 0.85rem;
                opacity: 0.7;
            }
            label {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 0;
                cursor: pointer;
            }
            label + label {
                border-top: 1px solid rgba(128, 128, 128, 0.25);
            }
            input {
                margin: 0;
                width: 16px;
                height: 16px;
                accent-color: #4CAE50;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Profile cards</h1>
        <p>
            Choose which cards show on raid.report and dungeon.report profiles.
        </p>
        <label><input type="checkbox" id="showLoadout" />Display current loadout card</label>
        <label><input type="checkbox" id="showActivity" />Display current activity card</label>
        <label><input type="checkbox" id="showFireteam" />Display current fireteam card</label>
        <script src="settings.js"></script>
        <script src="options.js"></script>
    </body>
</html>
